[project]
name = "rabona-backend"
description = "API FastAPI de RabonaAI"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.5",
    "pydantic-settings>=2.16.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
